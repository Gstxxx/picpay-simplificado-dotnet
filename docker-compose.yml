services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picpay
      POSTGRES_PASSWORD: picpay
      POSTGRES_DB: picpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=picpay;Username=picpay;Password=picpay
      Database__MigrateOnStartup: "true"
      Database__Seed: "true"
      Swagger__Enabled: "true"
      Jwt__Secret: ${JWT_SECRET:-compose-secret-change-me-0123456789abcdef}
    ports:
      - "8080:8080"

volumes:
  pgdata:
