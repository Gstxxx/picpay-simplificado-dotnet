services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picpay
      POSTGRES_PASSWORD: picpay
      POSTGRES_DB: picpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
